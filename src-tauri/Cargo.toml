[package]
name = "ember-os"
version = "0.1.3"
description = "EmberOS — your personal operating system"
authors = ["Ember"]
edition = "2021"

# The library that main.rs (and, later, a mobile entrypoint) calls into.
[lib]
name = "ember_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Smaller, faster release binaries — matters for a "feels instant" desktop app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
