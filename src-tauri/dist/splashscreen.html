<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EmberOS</title>
    <style>
      :root {
        --bg: #0b0a0f;
        --ink: #f4f1ee;
        --muted: #a7a1b4;
        --ember: #ff6b3d;
        --ember-2: #ff9d5c;
        --glow: rgba(255, 107, 61, 0.55);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        -webkit-user-select: none; user-select: none;
        cursor: default;
      }
      .card {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 22px;
        border-radius: 20px;
        background:
          radial-gradient(120% 90% at 50% 8%, rgba(255,107,61,0.16), transparent 60%),
          linear-gradient(180deg, #121017 0%, #0b0a0f 100%);
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 30px 90px -20px rgba(0,0,0,0.8);
        animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes rise {
        from { opacity: 0; transform: scale(0.97) translateY(10px); }
        to   { opacity: 1; transform: none; }
      }
      .halo {
        position: absolute; top: 78px;
        width: 150px; height: 150px; border-radius: 50%;
        background: radial-gradient(circle, var(--glow), transparent 68%);
        filter: blur(20px);
        animation: breathe 3.4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50%      { opacity: 0.8;  transform: scale(1.08); }
      }
      .flame {
        position: relative; z-index: 2;
        display: flex; align-items: center; justify-content: center;
        width: 74px; height: 74px; border-radius: 22px;
        background: rgba(255,107,61,0.12);
        box-shadow: 0 0 40px -6px var(--glow), inset 0 0 0 1px rgba(255,255,255,0.06);
        animation: flicker 2.6s ease-in-out infinite;
      }
      @keyframes flicker {
        0%, 100% { transform: rotate(-2deg) scale(1); }
        50%      { transform: rotate(2deg) scale(1.04); }
      }
      .flame svg { filter: drop-shadow(0 0 10px var(--glow)); }
      .title { z-index: 2; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; color: var(--ink); }
      .sub   { z-index: 2; margin-top: -14px; font-size: 12.5px; color: var(--muted); }
      .bar {
        z-index: 2; position: relative;
        width: 180px; height: 3px; border-radius: 99px;
        background: rgba(255,255,255,0.08); overflow: hidden;
      }
      .bar::after {
        content: ""; position: absolute; inset: 0;
        width: 40%; border-radius: 99px;
        background: linear-gradient(90deg, var(--ember), var(--ember-2));
        box-shadow: 0 0 12px -2px var(--glow);
        animation: slide 1.25s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { left: -40%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="halo"></div>
      <div class="flame">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ff9d5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
        </svg>
      </div>
      <div class="title">EmberOS</div>
      <div class="sub">Lighting the embers…</div>
      <div class="bar"></div>
    </div>
  </body>
</html>
